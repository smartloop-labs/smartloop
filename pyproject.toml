[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slp"
version = "1.0.11"
description = "AI Agent harness for extracting information and creating new content"
requires-python = ">=3.11"
dependencies = [
    # Core ML Dependencies (inference)
    "torch>=2.5.1",
    "transformers>=4.57,<5.0.0",
    "accelerate>=0.25.0",
    "tokenizers>=0.15.0",
    "sentencepiece>=0.1.99",
    "huggingface-hub>=0.20.0",
    "mistral-common[image]>=1.8.6",

    # Embeddings run on llama.cpp (GGUF); see smartloop/db/llama_embeddings.py.

    # LangChain Framework
    "langchain>=0.3.27",
    "langchain-community==0.3.31",
    "langchain-text-splitters>=0.3.3",

    # Document Processing
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.1",
    "pymupdf>=1.24.0",
    "pylatexenc>=2.10",

    # API Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",

    # Utilities and Configuration
    "pydantic==2.12.5",
    "pydantic-settings>=2.10.1",
    "rich>=13.7.0",
    "json-repair==0.60.1",
    "prettytable==3.16.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",

    # Data Processing
    "pandas>=1.5.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0,<2.4",

    # Progress Bars
    "tqdm>=4.66.0",

    # MCP server support
    "mcp>=1.26.0",
    "markdownify>=0.11.0",

    # CLI / TUI
    "prompt_toolkit>=3.0.47",
    "textual>=0.75.0",
    "certifi",
]

[project.optional-dependencies]
training = [
    "smartloop-trainer>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
slp = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:builtin type Swig.*:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]

[tool.setuptools]
py-modules = ["main", "version"]

[tool.setuptools.packages.find]
include = ["tui*", "smartloop*"]

[tool.setuptools.package-data]
tui = ["css/*.tcss", "css/*.css"]
"smartloop.skills" = ["*.md"]
