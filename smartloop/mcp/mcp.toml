#  Crawl plans — how a document-type MCP server's content gets indexed.
#
#  A plan is a read-only walk over the listing tools a person would call to see
#  "everything" on a server.  Results are vectorized as documents, so retrieval
#  has the server's content from the first message instead of depending on a
#  live tool call landing.  See smartloop/mcp/crawl_plans.py for the model each
#  entry below is validated against.
#
#  ── Adding your own ────────────────────────────────────────────────────────
#
#  Drop a .toml file into  ~/.smartloop/mcp.d/  (or write ~/.smartloop/mcp.toml)
#  using the same shape — one file per connection, named after it. Files are
#  read in name order and merged over this one, so an entry whose key matches a
#  built-in replaces it, unless it sets `extend = true`, which appends its index
#  steps instead. A file that fails to parse or validate is skipped with a
#  logged reason; the rest still load.
#
#  A minimal file, for a server with content worth indexing:
#
#      [[mcp]]
#      name = "my-wiki"
#      url = "https://mcp.example.com/mcp"
#
#      [[mcp.index]]
#      label = "pages"
#      tools = ["list_pages", "search"]
#      detail_tools = ["get_page"]
#
#  And one for a server that just needs connecting, with nothing to enumerate:
#
#      [[mcp]]
#      name = "yahoo-finance"
#      command = "uvx"
#      args = ["yahoo-finance-mcp"]
#
#  ── Fields ─────────────────────────────────────────────────────────────────
#
#  [[mcp]]
#    name            required. What the connection is called.
#    slug            optional. Defaults to `name`; set it to match the curated
#                    catalog slug a server was installed from.
#    match           extra substrings tried (case-insensitively) against an
#                    installed server's name, package and URL. `name` and `slug`
#                    are always tried, so this is for aliases.
#    type            "local" or "remote". Optional — inferred from whichever of
#                    `command` / `url` is present, so a file that says it
#                    plainly doesn't have to say it twice.
#    command, args   a server run as a process. `command` is whatever launches
#    env, cwd        it — uvx, npx, python, a path.
#                      command = "uvx"
#                      args = ["yahoo-finance-mcp"]
#    url, token      a server reached over HTTP. OAuth is negotiated at install
#                    time; `token` is for the servers that take a bearer token.
#                      url = "https://mcp.linear.app/mcp"
#                    A definition is local or remote, never both, and the
#                    curated entries below are neither — the backend already
#                    holds their connection details.
#    crawl           optional. true/false to force indexing on or off; omitted
#                    means indexed when this file declares index steps.
#    index_every     how often to re-index this connection: "30s", "15m", "6h",
#                    "1d", or a number of seconds. Unset follows the app-wide
#                    schedule (every 10 min while idle, hourly regardless).
#                    The right cadence belongs to the source: an air-quality
#                    reading is stale within the hour, a reference wiki is the
#                    same next week.
#    extend          append to the entry with this key instead of replacing it.
#
#  [[mcp.index]]     OPTIONAL. Without any, the server's tools are indexed and
#                    nothing else — which is right for the many servers that
#                    have no content to enumerate.
#    label           required, unique within the entry. Names the step in logs
#                    and in each indexed document's id.
#    tools           required. Candidate tool names, first match on the server
#                    wins. Matched loosely (`search` finds `notion-search`),
#                    so listing a name a server doesn't have costs nothing.
#    arguments       passed to the tool, filtered against its input schema —
#                    an argument the server doesn't declare is dropped rather
#                    than rejected.
#    needs_arguments arguments without which the step is pointless. Normally an
#                    unknown argument is dropped and the step still runs; name
#                    it here when losing it would make this step a duplicate of
#                    another one.
#    parent          one step label, or several. This step then runs once per
#                    record those steps produced, with the record's id passed
#                    as whichever of `parent_args` the tool declares. Parents
#                    must be declared earlier in the entry.
#    for_each        fan out over values you name instead of over another
#                    step's records: `for_each = { ticker = ["AAPL", "MSFT"] }`
#                    runs the step once per ticker. For servers that can't be
#                    enumerated — a market-data or weather server answers
#                    questions you already know to ask, so the subjects have to
#                    come from you. Alternative to `parent`, not combinable;
#                    `max_parents` caps how many values are used.
#    detail_tools    fetch the full body of each record (a page's content
#                    behind a search hit), by whichever of `detail_args` the
#                    tool declares.
#    max_records     records kept from this step (default 40). A crawl is a
#                    refresh, not an export: this bounds the embedding work and
#                    the number of follow-up detail calls.
#    max_parents     parent records (or named values) fanned out over,
#                    default 8.
#
#  Anywhere a list of names is expected, "@name" expands to an alias below.

# ── Aliases ────────────────────────────────────────────────────────────────
# Name lists reused across steps. TOML has no variables, and these run to a
# dozen entries each; spelling them out per step would bury the difference
# between steps in the part that is identical.

[alias]

# Notion's page body fetch.  `notion-fetch` returns the page as markdown in one
# call, so it leads; on the OpenAPI server the body lives in the block children
# rather than in the page object, so that name is preferred over
# `API-retrieve-a-page` (which returns properties only).  Spelled-out variants
# are listed because the loose matcher pairs on affixes, and `retrieve-a-page`
# shares none with `retrieve_page`.
notion_fetch = [
  "notion-fetch", "notion_fetch", "fetch",
  "API-get-block-children", "get_block_children", "retrieve_block_children",
  "API-retrieve-a-page", "retrieve_a_page", "get_page", "retrieve_page",
  "notion_retrieve_page",
]
notion_search = [
  "notion-search", "notion_search", "API-post-search", "post_search",
  "search_pages", "search",
]
# Page/block ids, in the argument names the two Notion vocabularies use.
notion_page_args = ["page_id", "pageId", "block_id", "blockId", "id", "url", "uri"]

linear_issue_tools = ["list_issues", "linear_list_issues", "get_issues"]
linear_issue_detail = ["get_issue", "linear_get_issue"]
linear_project_tools = ["list_projects", "linear_list_projects", "get_projects"]
linear_project_detail = ["get_project", "linear_get_project"]
linear_team_args = ["teamId", "team_id", "team", "teamIds"]
linear_project_args = ["projectId", "project_id", "project"]
linear_issue_args = ["issueId", "issue_id", "issue"]


# ── Notion ─────────────────────────────────────────────────────────────────
#
# Notion ships under two very different tool vocabularies and the plan has to
# reach the same content through either:
#
#   hosted (mcp.notion.com)   notion-search, notion-fetch,
#                             notion-list-{recent,private,shared,favorite}-pages,
#                             notion-get-comments, notion-get-users
#   OpenAPI (@notionhq)       API-post-search, API-retrieve-a-page,
#                             API-get-block-children, API-post-database-query,
#                             API-retrieve-a-comment, API-get-users
#
# The route that reaches the most content is the same in both: enumerate every
# page and database the integration can see (dedicated listings where they
# exist, an unfiltered search otherwise), fetch each page's body, then walk into
# each database for the rows a page listing never returns.

[[mcp]]
name = "notion"
match = ["notion"]

# The dedicated listing tools first: they take no required argument, so they are
# the reliable way to enumerate what the connection can see.  Their results
# overlap heavily (a recent page is usually also a private or shared one) — the
# crawler dedupes by record id across steps, so the overlap costs nothing.
[[mcp.index]]
label = "recent-pages"
tools = ["notion-list-recent-pages", "list_recent_pages"]
arguments = { limit = 50 }
detail_tools = ["@notion_fetch"]
detail_args = ["@notion_page_args"]

[[mcp.index]]
label = "private-pages"
tools = ["notion-list-private-pages", "list_private_pages"]
arguments = { limit = 50 }
detail_tools = ["@notion_fetch"]
detail_args = ["@notion_page_args"]

[[mcp.index]]
label = "shared-pages"
tools = ["notion-list-shared-pages", "list_shared_pages"]
arguments = { limit = 50 }
detail_tools = ["@notion_fetch"]
detail_args = ["@notion_page_args"]

[[mcp.index]]
label = "favorite-pages"
tools = ["notion-list-favorite-pages", "list_favorite_pages"]
arguments = { limit = 50 }
detail_tools = ["@notion_fetch"]
detail_args = ["@notion_page_args"]

# Search after them, and it carries the crawl on its own for the Notion servers
# that ship no listing tools: an unfiltered search is the OpenAPI server's
# "everything shared with this integration".  The hosted server makes `query`
# required, so the empty-query call there simply fails and the step is skipped.
[[mcp.index]]
label = "pages"
tools = ["@notion_search"]
arguments = { query = "", page_size = 100 }
detail_tools = ["@notion_fetch"]
detail_args = ["@notion_page_args"]
max_records = 60

# Databases have to be enumerated separately: a page-shaped search result set
# doesn't contain them, and their rows are the part of a Notion workspace a page
# listing never reaches.
[[mcp.index]]
label = "databases"
tools = ["list_databases", "notion_list_databases", "get_databases", "notion-list-databases"]
max_records = 25

# The same search, filtered to database objects — how the OpenAPI server
# enumerates databases, since it has no listing tool for them.  Where the filter
# isn't declared it is dropped and this would repeat the `pages` call, so
# `needs_arguments` skips the step instead.
[[mcp.index]]
label = "database-search"
tools = ["@notion_search"]
arguments = { query = "", page_size = 100, filter = { property = "object", value = "database" } }
needs_arguments = ["filter"]
max_records = 25

# A database listing is a list of table names; the rows are behind a query per
# database, so the walk continues into each one.
[[mcp.index]]
label = "database-pages"
tools = ["API-post-database-query", "post_database_query", "query_database", "notion_query_database", "notion-query-database"]
parent = ["databases", "database-search"]
parent_args = ["database_id", "databaseId", "data_source_id", "id"]
detail_tools = ["@notion_fetch"]
detail_args = ["@notion_page_args"]
max_records = 60
max_parents = 25

[[mcp.index]]
label = "meeting-notes"
tools = ["notion-query-meeting-notes", "query_meeting_notes"]
detail_tools = ["@notion_fetch"]
detail_args = ["@notion_page_args"]

# Comments hold the decisions and corrections that never make it back into the
# page body, so they are pulled per page the walk found.
[[mcp.index]]
label = "page-comments"
tools = ["notion-get-comments", "notion_retrieve_comments", "API-retrieve-a-comment", "retrieve_comments", "get_comments", "list_comments"]
parent = ["recent-pages", "private-pages", "shared-pages", "favorite-pages", "pages", "database-pages"]
parent_args = ["@notion_page_args"]
max_records = 60
max_parents = 30

# One call, and it is what lets a page's `created_by` id read back as a name.
[[mcp.index]]
label = "users"
tools = ["notion-get-users", "API-get-users", "get_users", "list_users"]
max_records = 50


# ── Linear ─────────────────────────────────────────────────────────────────
#
# Linear's object graph is a tree — team → project → issue → comment — and the
# workspace-wide listings are paged and default to a slice of it.  Walking the
# tree is what reaches the rest: `list_issues` with no argument returns one page
# of the workspace, `list_issues` once per team returns a page *per team*.

[[mcp]]
name = "linear"
match = ["linear"]

# The root of the walk.  `list_teams` takes no required argument, so it is the
# one call that works on any Linear connection, and every team-scoped step below
# fans out over what it returns.
[[mcp.index]]
label = "teams"
tools = ["list_teams", "linear_list_teams", "get_teams"]
detail_tools = ["get_team", "linear_get_team"]
max_records = 25

# Workspace-wide listings run first so their (usually richer) rows win the
# dedupe, and so a server that only exposes the unscoped variants still gets
# crawled.
[[mcp.index]]
label = "projects"
tools = ["@linear_project_tools"]
arguments = { limit = 50 }
detail_tools = ["@linear_project_detail"]

[[mcp.index]]
label = "team-projects"
tools = ["@linear_project_tools"]
parent = "teams"
parent_args = ["@linear_team_args"]
detail_tools = ["@linear_project_detail"]
max_parents = 25

# `list_my_issues` trails the unscoped names as a last resort, for the Linear
# packagings that ship no workspace-wide issue listing.
[[mcp.index]]
label = "issues"
tools = ["list_issues", "linear_list_issues", "get_issues", "list_my_issues"]
arguments = { limit = 50 }
detail_tools = ["@linear_issue_detail"]

# Kept separate from `issues`: on the hosted server `list_my_issues` is the
# assignee-scoped view, which surfaces work the unscoped page cut off.
[[mcp.index]]
label = "my-issues"
tools = ["list_my_issues", "linear_list_my_issues"]
arguments = { limit = 50 }
detail_tools = ["@linear_issue_detail"]

# The widest branch of the walk: one page of issues per team.
[[mcp.index]]
label = "team-issues"
tools = ["@linear_issue_tools"]
arguments = { limit = 50 }
parent = "teams"
parent_args = ["@linear_team_args"]
detail_tools = ["@linear_issue_detail"]
max_records = 80
max_parents = 25

[[mcp.index]]
label = "project-issues"
tools = ["@linear_issue_tools"]
arguments = { limit = 50 }
parent = ["projects", "team-projects"]
parent_args = ["@linear_project_args"]
detail_tools = ["@linear_issue_detail"]
max_records = 60
max_parents = 20

[[mcp.index]]
label = "cycles"
tools = ["list_cycles", "linear_list_cycles", "get_cycles"]
parent = "teams"
parent_args = ["@linear_team_args"]
max_parents = 25

# The discussion on an issue is often where the actual answer lives, so comments
# are pulled from whichever listing found each issue.
[[mcp.index]]
label = "issue-comments"
tools = ["list_comments", "linear_list_comments", "get_comments"]
parent = ["issues", "my-issues", "team-issues", "project-issues"]
parent_args = ["@linear_issue_args"]
max_records = 60
max_parents = 30

[[mcp.index]]
label = "documents"
tools = ["list_documents", "linear_list_documents", "get_documents"]
detail_tools = ["get_document", "linear_get_document"]

# Not content, but it is what lets "what is Sam working on" resolve a name to
# the assignee the issue rows carry.
[[mcp.index]]
label = "users"
tools = ["list_users", "linear_list_users", "get_users"]
max_records = 50


# ── Trello ─────────────────────────────────────────────────────────────────

[[mcp]]
name = "trello"
match = ["trello"]

[[mcp.index]]
label = "boards"
tools = ["list_boards", "get_boards", "trello_list_boards", "get_my_boards", "list_boards_by_user"]
max_records = 20

[[mcp.index]]
label = "lists"
tools = ["get_lists", "list_lists", "trello_get_lists", "get_lists_by_board_id", "get_board_lists"]
parent = "boards"
parent_args = ["board_id", "boardId", "idBoard", "id"]
max_parents = 20

# A card row carries the name but usually not the description or checklists,
# which is the part worth answering from.
[[mcp.index]]
label = "cards"
tools = ["get_cards_by_list_id", "list_cards", "get_cards", "trello_get_cards", "get_list_cards"]
parent = "lists"
parent_args = ["list_id", "listId", "idList", "id"]
detail_tools = ["get_card", "trello_get_card", "get_card_by_id"]
max_records = 60
max_parents = 20
