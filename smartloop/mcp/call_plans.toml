#  Follow-up calls — what to call once a server has answered.
#
#  A listing tool says which records exist; a detail tool says what they
#  contain. `notion-search` returns page titles and ids, and the pitch
#  document's text is one more call away. Nothing in either tool's schema says
#  the two go together, so the pairing is declared here and applied to whatever
#  call a question just made. See smartloop/mcp/call_plans.py.
#
#  ── Adding your own ────────────────────────────────────────────────────────
#
#  Put a [[plan]] entry in any file under ~/.smartloop/mcp.d/ (or in
#  ~/.smartloop/mcp.toml, alongside the [[mcp]] connection it belongs to). An
#  entry whose slug matches a built-in replaces it.
#
#      [[plan]]
#      slug = "my-wiki"
#      match = ["wiki"]
#      detail_tools = ["get_page", "fetch_page"]
#      detail_args = ["page_id", "id"]
#
#  ── Fields ─────────────────────────────────────────────────────────────────
#
#  slug              required. Also the first thing matched against an
#                    installed server (its catalog slug wins outright).
#  match             extra substrings tried against the server's name, package
#                    and URL.
#  detail_tools      candidate names for the tool that fetches one record,
#                    best first. Matched loosely, so `fetch` finds
#                    `notion-fetch`; naming a tool the server lacks costs
#                    nothing.
#  detail_args       argument names that tool takes a record's id under. The
#                    tool's own schema decides which one is used, and a tool
#                    with a single required argument takes the id under
#                    whatever it calls it.
#  detail_arguments  fixed arguments the detail call also needs — the content
#                    type to return, the operation on a server where one tool
#                    covers several. Filtered against the tool's schema, so an
#                    argument it doesn't declare is dropped rather than
#                    rejecting the call.
#  max_records       how many records one answer follows up on (default 3). A
#                    search returns twenty hits and the question is about one
#                    or two; twenty round-trips to find that out is a worse
#                    answer, later.

# ── Notion ─────────────────────────────────────────────────────────────────
#
# Two vocabularies reach the same content. `notion-fetch` (hosted) returns a
# page as markdown in one call, so it leads; on the OpenAPI server the body
# lives in the block children rather than in the page object, so that name is
# preferred over `API-retrieve-a-page`, which returns properties only. The
# spelled-out variants are listed because the loose matcher pairs on affixes,
# and `retrieve-a-page` shares none with `retrieve_page`.
[[plan]]
slug = "notion"
match = ["notion"]
detail_tools = [
  "notion-fetch", "notion_fetch", "fetch",
  "API-get-block-children", "get_block_children", "retrieve_block_children",
  "API-retrieve-a-page", "retrieve_a_page", "get_page", "retrieve_page",
  "notion_retrieve_page",
]
detail_args = ["page_id", "pageId", "block_id", "blockId", "id", "url", "uri"]
detail_arguments = { include_discussions = true }

# ── Linear ─────────────────────────────────────────────────────────────────
#
# An issue listing carries titles and states; the description and comments are
# behind the per-issue fetch.
[[plan]]
slug = "linear"
match = ["linear"]
detail_tools = ["get_issue", "linear_get_issue", "get_project", "linear_get_project"]
detail_args = ["issueId", "issue_id", "issue", "id"]

# ── Trello ─────────────────────────────────────────────────────────────────
#
# The hosted server's card listing already carries the card body, so this names
# only the packaged servers' fetch — where the rows really are just headers.
[[plan]]
slug = "trello"
match = ["trello"]
detail_tools = ["get_card", "trello_get_card", "get_card_by_id"]
detail_args = ["cardIdOrUrl", "cardId", "card_id", "id"]

# ── Canva ──────────────────────────────────────────────────────────────────
#
# `get-design-content` is what returns the text on a design; `get-design`
# returns metadata the search hit already had. `content_types` is required and
# says nothing about which design is wanted, which is what detail_arguments is
# for.
[[plan]]
slug = "canva"
match = ["canva"]
detail_tools = ["get-design-content", "get_design_content"]
detail_args = ["design_id", "designId", "id"]
detail_arguments = { content_types = ["richtexts"], user_intent = "Read the text content of a design" }

# ── monday.com ─────────────────────────────────────────────────────────────
#
# A board listing names boards; the items on them are a second call, and
# monday declares the board id as a number while its listings return strings
# (see `coerce_argument`).
[[plan]]
slug = "monday"
match = ["monday", "monday.com"]
detail_tools = ["get_board_items_page", "get_board_items", "get_board_info"]
detail_args = ["boardId", "board_id", "boardIds", "id"]
