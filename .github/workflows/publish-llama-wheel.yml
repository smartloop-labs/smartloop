name: Publish portable llama-cpp wheel

# Builds the AVX-512-free CUDA llama-cpp-python wheel in a manylinux_2_28 + CUDA
# container (glibc 2.28 -> runs on RHEL/Alma 8+, Ubuntu 18.04+, Debian 10+, plus
# all modern distros) and publishes it to our private Artifact Registry, so the
# release build (build.yml) pulls it instead of recompiling (~30 min) every run.
#
# The container produces the wheel; the runner host publishes it (WIF auth +
# twine). Building on the dev box does NOT work — its glibc (2.43) is newer than
# the runners and most user machines, so the wheel would only run on bleeding-edge
# systems. The container pins an old glibc regardless of runner OS.
on:
  workflow_dispatch:
    inputs:
      llama_version:
        description: 'llama-cpp-python version to build'
        required: false
        default: '0.3.25'

permissions:
  contents: read
  id-token: write   # for google-github-actions/auth Workload Identity Federation

env:
  MANYLINUX_IMAGE: sameli/manylinux_2_28_x86_64_cuda_12.3:latest
  # Broad GPU arch list (Pascal..Hopper) + PTX on top arch for forward-compat.
  CUDA_ARCHES: "61-real;70-real;75-real;80-real;86-real;89-real;90-real;90-virtual"

jobs:
  publish-linux-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CUDA manylinux image (~6 GB) + a ~1.4 GB wheel + build tree need more
      # than the default free space on the runner.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true

      # GGML_NATIVE=OFF / GGML_AVX512=OFF -> portable CPU backend (no SIGILL on
      # non-AVX-512 CPUs); GGML_CUDA=ON for GPU offload. Built against glibc 2.28.
      - name: Build portable CUDA wheel (manylinux_2_28)
        run: |
          mkdir -p dist-wheels
          docker run --rm -v "$PWD/dist-wheels:/out" \
            -e CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)" \
            -e CMAKE_ARGS="-DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=${CUDA_ARCHES} -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF" \
            "$MANYLINUX_IMAGE" \
            bash -lc '/opt/python/cp311-cp311/bin/pip wheel "llama-cpp-python==${{ inputs.llama_version }}" --no-binary llama-cpp-python --no-deps --no-cache-dir -w /out'
          ls -la dist-wheels

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PUBLISH_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Publish to Artifact Registry
        run: |
          python3 -m pip install --quiet --break-system-packages twine
          twine upload \
            --repository-url https://us-central1-python.pkg.dev/smartloop-gcp-us-east/llama-cpp/ \
            --username oauth2accesstoken --password "$(gcloud auth print-access-token)" \
            dist-wheels/*.whl
