name: Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  GCS_BUCKET: gs://smartloop-gcp-us-east-releases

jobs:
  build-linux:
    # Build inside manylinux_2_28 (AlmaLinux 8, glibc 2.28) — NOT just on an old
    # runner OS. PyInstaller copies the *build* machine's libpython into the
    # bundle but deliberately does not bundle glibc, so the artifact's
    # compatibility floor is the glibc the interpreter was compiled against, not
    # the runner. The old `runs-on: ubuntu-22.04` pin looked safe but
    # actions/setup-python downloads a prebuilt CPython built on glibc 2.38, so
    # the bundle inherited a 2.38 floor and failed to load at install time on
    # Ubuntu 22.04 / Debian 12 / RHEL 9 ("version `GLIBC_2.38' not found").
    #
    # manylinux_2_28 is the lowest glibc that still satisfies the GitHub runner's
    # node20 (needs >= 2.28), so we run only the heavy build in the container and
    # keep checkout/verify/upload on the host — the 2.28-floored binary runs fine
    # on the 2.35 host. Floor: RHEL/Alma/Rocky 8+, Ubuntu 20.04+, Debian 11+.
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Everything that ends up in the bundle (the cp311 interpreter, our deps,
      # the CUDA runtime) is installed and linked inside the container, so the
      # whole payload shares the 2.28 floor.
      #
      # The manylinux /opt/python/cp311-cp311 is statically linked (no
      # libpython3.11.so), which PyInstaller cannot use. We build CPython 3.11
      # from source with --enable-shared so PyInstaller gets the shared library
      # it needs, while still linking against the container's glibc 2.28.
      - name: Build in manylinux_2_28 (glibc 2.28 floor)
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -euxo pipefail -c '
              PY_VERSION=3.11.15
              PREFIX=/opt/shared-python

              # Build CPython with a shared libpython for PyInstaller.
              curl -fsSL https://www.python.org/ftp/python/${PY_VERSION}/Python-${PY_VERSION}.tar.xz \
                | tar xJ -C /tmp
              cd /tmp/Python-${PY_VERSION}
              ./configure --enable-shared --enable-optimizations --prefix=${PREFIX} -q
              make -j$(nproc) -s
              make install -s
              cd /work

              export PATH=${PREFIX}/bin:$PATH
              export LD_LIBRARY_PATH=${PREFIX}/lib:${LD_LIBRARY_PATH:-}
              python3 --version

              # CUDA 12.6 runtime from NVIDIA'\''s rhel8 repo (apt -> dnf). The
              # ggml-cuda.so from the prebuilt wheel links libcudart/libcublas;
              # PyInstaller bundles them transitively once they are on
              # LD_LIBRARY_PATH, so install before build-binary and export it.
              dnf install -y dnf-plugins-core
              dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
              dnf install -y cuda-cudart-12-6 libcublas-12-6
              export LD_LIBRARY_PATH=/usr/local/cuda-12.6/lib64:${LD_LIBRARY_PATH}

              make build CUDA=1
              make build-binary
            '
          # dist/ and build/ are written as root inside the container; hand them
          # back to the runner user for the host-side verify/archive steps.
          sudo chown -R "$(id -u):$(id -g)" dist build 2>/dev/null || true

      # CI has no NVIDIA driver, so we can't offload here — instead assert the
      # bundle is correct: right version, GPU backend compiled in, CUDA 12
      # runtime bundled, everything resolvable without the system CUDA, and the
      # glibc floor held.
      - name: Verify build
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="$(dist/slp/slp --version | awk '{print $NF}')"
          [ "$VER" = "${TAG#v}" ] || { echo "FAIL: binary reports version $VER, tag says ${TAG#v}"; exit 1; }
          CUDA_SO="$(find dist/slp/_internal -name libggml-cuda.so | head -1)"
          [ -n "$CUDA_SO" ] || { echo "FAIL: libggml-cuda.so missing — CPU-only build"; exit 1; }
          for so in libcudart.so.12 libcublas.so.12 libcublasLt.so.12; do
            test -e "dist/slp/_internal/$so" || { echo "FAIL: $so not bundled into the dist"; exit 1; }
          done
          # Resolved against the bundle alone (the PyInstaller bootloader sets
          # LD_LIBRARY_PATH to _internal at runtime), only the GPU *driver*
          # (libcuda.so.1, provided by the user's NVIDIA driver) may be unresolved.
          missing="$(LD_LIBRARY_PATH="$PWD/dist/slp/_internal" ldd "$CUDA_SO" | awk '/not found/{print $1}' | grep -vxF 'libcuda.so.1' || true)"
          [ -z "$missing" ] || { echo "FAIL: unresolved non-driver deps:"; echo "$missing"; exit 1; }

          # Regression guard the old runner-OS pin lacked: fail if ANY bundled
          # ELF (interpreter, deps, or the bootloader) requires a glibc newer
          # than our support floor. This is what would have caught the 2.38
          # interpreter before it shipped. Built in manylinux_2_28 the real floor
          # is ~2.28; we gate at 2.34 (RHEL/Rocky 9, Amazon Linux 2023) so a
          # benign dep bump doesn't block a release, but a 2.38 regression does.
          FLOOR=2.34
          maxver="$(find dist/slp \( -name '*.so' -o -name '*.so.*' -o -name slp \) -type f -print0 \
            | xargs -0 -r objdump -T 2>/dev/null \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)"
          echo "Highest glibc symbol required by bundle: GLIBC_${maxver:-none} (floor GLIBC_$FLOOR)"
          if [ -n "$maxver" ] && [ "$(printf '%s\n%s\n' "$FLOOR" "$maxver" | sort -V | tail -1)" != "$FLOOR" ]; then
            echo "FAIL: bundle requires GLIBC_$maxver > floor GLIBC_$FLOOR — offending files:"
            find dist/slp \( -name '*.so' -o -name '*.so.*' -o -name slp \) -type f -print0 \
              | xargs -0 -r sh -c 'for f; do objdump -T "$f" 2>/dev/null | grep -q "GLIBC_'"$maxver"'\b" && echo "  $f"; done' _
            exit 1
          fi
          echo "OK: slp $VER, GPU bindings present, CUDA 12 runtime bundled, glibc floor <= GLIBC_$FLOOR."

      - name: Archive
        run: make archive

      - name: Compute SHA256
        run: sha256sum *-slp.tar.gz | tee linux-amd64-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-slp
          path: |
            *-slp.tar.gz
            linux-amd64-sha256.txt

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-macos-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-macos-

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install dependencies
        run: make build

      - name: Build slp binary
        run: make build-binary

      - name: Verify build
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="$(dist/slp/slp --version | awk '{print $NF}')"
          [ "$VER" = "${TAG#v}" ] || { echo "FAIL: binary reports version $VER, tag says ${TAG#v}"; exit 1; }
          echo "OK: slp $VER"

      - name: Sign
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: make sign

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: make notarize

      - name: Archive
        run: make archive

      - name: Compute SHA256
        run: shasum -a 256 *-slp.tar.gz | tee darwin-arm64-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-slp
          path: |
            *-slp.tar.gz
            darwin-arm64-sha256.txt

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.0'

      - name: Install make
        run: choco install make -y

      - name: Install dependencies
        run: make build CUDA=1

      # llama_cpp's ggml-cuda.dll (from the prebuilt GCS wheel or the source
      # fallback) links against the toolkit's CUDA runtime but does not vendor
      # those DLLs. Copy them from the toolkit into llama_cpp/lib so the
      # PyInstaller spec bundles them next to ggml-cuda.dll (found via the
      # loader's add_dll_directory).
      - name: Bundle CUDA runtime into llama_cpp
        run: |
          set -euo pipefail
          LLAMA_LIB="$(cygpath -u "$(.venv/Scripts/python -c 'import os,importlib.util as u; s=u.find_spec("llama_cpp"); print(os.path.join(os.path.dirname(s.origin),"lib"))')")"
          [ -f "$LLAMA_LIB/ggml-cuda.dll" ] || { echo "FAIL: ggml-cuda.dll missing — CPU-only build (GGML_CUDA=ON not honored?)"; exit 1; }
          CUDA_BIN="$(cygpath -u "${CUDA_PATH:-$CUDA_HOME}")/bin"
          [ -d "$CUDA_BIN" ] || { echo "FAIL: CUDA bin dir not found (CUDA_PATH=$CUDA_PATH CUDA_HOME=$CUDA_HOME)"; exit 1; }
          for pat in cudart64 cublas64 cublasLt64; do
            src="$(ls "$CUDA_BIN"/${pat}_*.dll 2>/dev/null | head -1)"
            [ -n "$src" ] || { echo "FAIL: ${pat}_*.dll not found in $CUDA_BIN — toolkit install incomplete"; exit 1; }
            cp "$src" "$LLAMA_LIB/"
            echo "  bundled $(basename "$src") <- $src"
          done

      - name: Build slp binary
        run: make build-binary

      - name: Verify build
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="$(dist/slp/slp --version | awk '{print $NF}')"
          [ "$VER" = "${TAG#v}" ] || { echo "FAIL: binary reports version $VER, tag says ${TAG#v}"; exit 1; }
          GGML_CUDA="$(find dist/slp/_internal -name ggml-cuda.dll | head -1)"
          [ -n "$GGML_CUDA" ] || { echo "FAIL: ggml-cuda.dll missing — CPU-only build"; exit 1; }
          LIBDIR="$(dirname "$GGML_CUDA")"
          for pat in cudart64 cublas64 cublasLt64; do
            ls "$LIBDIR"/${pat}_*.dll >/dev/null 2>&1 || { echo "FAIL: ${pat}_*.dll not bundled next to ggml-cuda.dll"; exit 1; }
          done
          echo "OK: slp $VER, GPU bindings present, CUDA runtime bundled."

      - name: Archive
        run: make archive-zip

      - name: Compute SHA256
        run: sha256sum windows-amd64-slp.zip | tee windows-amd64-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64-slp
          path: |
            windows-amd64-slp.zip
            windows-amd64-sha256.txt

  publish:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64-slp
          path: artifacts/linux-amd64

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: darwin-arm64-slp
          path: artifacts/darwin-arm64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64-slp
          path: artifacts/windows-amd64

      - name: Prepare release assets
        run: |
          mv artifacts/linux-amd64/*-slp.tar.gz linux-amd64-slp.tar.gz
          mv artifacts/darwin-arm64/*-slp.tar.gz darwin-arm64-slp.tar.gz
          mv artifacts/windows-amd64/windows-amd64-slp.zip .
          ls -lh *-slp.*

      - name: Generate checksums
        run: sha256sum *-slp.* > checksums-sha256.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to GCS
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          DEST="$GCS_BUCKET/slp/${VERSION}"
          gsutil -m cp \
            linux-amd64-slp.tar.gz \
            darwin-arm64-slp.tar.gz \
            windows-amd64-slp.zip \
            checksums-sha256.txt \
            "$DEST/"
          echo "Uploaded to $DEST"
          gsutil ls -l "$DEST/"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # Idempotent for retags: replace any existing release for this tag.
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
