name: Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  GCS_BUCKET: gs://smartloop-gcp-us-east-releases

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CUDA runtime libraries
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-cudart-12-6 libcublas-12-6

      - name: Set CUDA environment
        run: |
          echo "LD_LIBRARY_PATH=/usr/local/cuda-12.6/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install dependencies
        run: make build CUDA=1

      - name: Build slp binary
        run: make build-binary

      - name: Verify build
        run: dist/slp/slp --version

      - name: Archive
        run: make archive

      - name: Compute SHA256
        run: sha256sum *-slp.tar.gz | tee linux-amd64-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-slp
          path: |
            *-slp.tar.gz
            linux-amd64-sha256.txt

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-macos-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-macos-

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install dependencies
        run: make build

      - name: Build slp binary
        run: make build-binary

      - name: Verify build
        run: dist/slp/slp --version

      - name: Sign
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: make sign

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: make notarize

      - name: Archive
        run: make archive

      - name: Compute SHA256
        run: shasum -a 256 *-slp.tar.gz | tee darwin-arm64-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-slp
          path: |
            *-slp.tar.gz
            darwin-arm64-sha256.txt

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.0'

      - name: Install make
        run: choco install make -y

      - name: Install dependencies
        run: make build CUDA=1

      - name: Build slp binary
        run: make build-binary

      - name: Verify build
        run: dist/slp/slp --version

      - name: Archive
        run: make archive-zip

      - name: Compute SHA256
        run: sha256sum windows-amd64-slp.zip | tee windows-amd64-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64-slp
          path: |
            windows-amd64-slp.zip
            windows-amd64-sha256.txt

  publish:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64-slp
          path: artifacts/linux-amd64

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: darwin-arm64-slp
          path: artifacts/darwin-arm64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64-slp
          path: artifacts/windows-amd64

      - name: Prepare release assets
        run: |
          mv artifacts/linux-amd64/*-slp.tar.gz linux-amd64-slp.tar.gz
          mv artifacts/darwin-arm64/*-slp.tar.gz darwin-arm64-slp.tar.gz
          mv artifacts/windows-amd64/windows-amd64-slp.zip .
          ls -lh *-slp.*

      - name: Generate checksums
        run: sha256sum *-slp.* > checksums-sha256.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to GCS
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          DEST="$GCS_BUCKET/slp/${VERSION}"
          gsutil -m cp \
            linux-amd64-slp.tar.gz \
            darwin-arm64-slp.tar.gz \
            windows-amd64-slp.zip \
            checksums-sha256.txt \
            "$DEST/"
          echo "Uploaded to $DEST"
          gsutil ls -l "$DEST/"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
