name: Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  # Releases live in Cloudflare R2 (no egress charge) and are served at
  # dl.smartloop.ai; see slp-infra-project cloudflare/README.md.
  R2_BUCKET: smartloop-releases

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          # LunarG ships no arm64 apt packages, so arm64 builds on 24.04 where
          # the distro's own Vulkan headers/glslc are new enough for ggml.
          # DGX Spark (DGX OS 7) is 24.04-based, so glibc 2.39 is fine there.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The Vulkan SDK provides the headers, loader, and glslc that the
      # GGML_VULKAN=ON source build of llama-cpp-python needs.
      - name: Install Vulkan SDK
        if: matrix.arch == 'amd64'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install Vulkan headers, loader and glslc (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers spirv-tools

      - name: Install dependencies
        run: make build

      - name: Build slp binary
        run: make build-binary

      - name: Verify build
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="$(dist/slp/slp --version | awk '{print $NF}')"
          [ "$VER" = "${TAG#v}" ] || { echo "FAIL: binary reports version $VER, tag says ${TAG#v}"; exit 1; }
          VULKAN_SO="$(find dist/slp/_internal -name libggml-vulkan.so | head -1)"
          [ -n "$VULKAN_SO" ] || { echo "FAIL: libggml-vulkan.so missing — CPU-only build"; exit 1; }
          # PyInstaller bundles the Vulkan loader (libvulkan) it finds linked
          # against libggml-vulkan.so; the ICD/driver comes from the host GPU.
          find dist/slp/_internal -name "libvulkan.so*" | grep -q . || { echo "FAIL: libvulkan.so (Vulkan loader) not bundled into the dist"; exit 1; }
          missing="$(LD_LIBRARY_PATH="$PWD/dist/slp/_internal:$PWD/dist/slp/_internal/llama_cpp/lib" ldd "$VULKAN_SO" | awk '/not found/{print $1}' || true)"
          [ -z "$missing" ] || { echo "FAIL: unresolved deps:"; echo "$missing"; exit 1; }
          # GPU inference is Vulkan; torch is CPU-only. If a CUDA torch sneaks
          # back in it drags >1GB of nvidia-cu12 runtime libs into the bundle.
          cuda="$(find dist/slp/_internal \( -name 'libcud*.so*' -o -name 'libcublas*.so*' -o -name 'libnvrtc*.so*' \) 2>/dev/null || true)"
          [ -z "$cuda" ] || { echo "FAIL: CUDA libs bundled (expected CPU-only torch):"; echo "$cuda"; exit 1; }
          echo "OK: slp $VER, Vulkan backend present, loader bundled, no CUDA libs."

      - name: Archive
        run: make archive

      - name: Compute SHA256
        run: sha256sum *-slp.tar.gz | tee linux-${{ matrix.arch }}-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-slp
          path: |
            *-slp.tar.gz
            linux-${{ matrix.arch }}-sha256.txt

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-macos-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-macos-

      # Vulkan headers/loader + glslc (shaderc) for the GGML_VULKAN=ON build;
      # molten-vk is the ICD that maps Vulkan onto Metal at runtime.
      # spirv-headers/spirv-tools satisfy ggml-vulkan's find_package(SPIRV-Headers)
      # at CMake-configure time — the LunarG SDK bundles these on Linux/Windows,
      # but on brew they're separate formulae.
      - name: Install Vulkan SDK (MoltenVK)
        run: brew install vulkan-headers vulkan-loader molten-vk shaderc spirv-headers spirv-tools

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install dependencies
        run: make build

      - name: Build slp binary
        run: make build-binary

      - name: Verify build
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="$(dist/slp/slp --version | awk '{print $NF}')"
          [ "$VER" = "${TAG#v}" ] || { echo "FAIL: binary reports version $VER, tag says ${TAG#v}"; exit 1; }
          find dist/slp/_internal -name "libggml-metal*" | grep -q . || { echo "FAIL: Metal backend missing from dist"; exit 1; }
          find dist/slp/_internal -name "libggml-vulkan*" | grep -q . || { echo "FAIL: Vulkan backend missing from dist"; exit 1; }
          find dist/slp/_internal -name "libvulkan*" | grep -q . || { echo "FAIL: Vulkan loader (libvulkan) not bundled"; exit 1; }
          find dist/slp/_internal -name "libMoltenVK*" | grep -q . || { echo "FAIL: MoltenVK not bundled — Vulkan would need a user install"; exit 1; }
          find dist/slp/_internal -name "MoltenVK_icd.json" | grep -q . || { echo "FAIL: MoltenVK ICD manifest not bundled"; exit 1; }
          # scipy must be the OpenBLAS wheel, not the Accelerate one — see
          # SCIPY_OPENBLAS_CMD in the Makefile. Its bundled BLAS proves the swap
          # survived PyInstaller collection; without it scipy fails to import.
          find dist/slp/_internal -name "libscipy_openblas*" | grep -q . || { echo "FAIL: scipy's bundled OpenBLAS missing — Accelerate-linked scipy wheel leaked in"; exit 1; }
          echo "OK: slp $VER, Metal + Vulkan backends present, MoltenVK bundled."

      # App Store review rejects binaries referencing the deprecated Accelerate
      # LAPACK symbols _dcabs1_/_lsame_/_xerbla_array__. Studio's Mac App Store
      # build bundles this framework verbatim, so catch it here rather than in
      # an ITMS rejection mail days later.
      - name: Verify no deprecated Apple APIs
        run: make check-apple-symbols

      - name: Sign
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: make sign

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: make notarize

      - name: Archive
        run: make archive

      - name: Compute SHA256
        run: shasum -a 256 *-slp.tar.gz | tee darwin-arm64-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-slp
          path: |
            *-slp.tar.gz
            darwin-arm64-sha256.txt

  build-windows:
    runs-on: windows-2022
    # Scopes the Azure OIDC token to a stable subject
    # (repo:smartloop-ai/smartloop:environment:release) so a single Trusted
    # Signing federated credential covers both tag-push and manual dispatch runs.
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The Vulkan SDK provides the headers, loader, and glslc that the
      # GGML_VULKAN=ON source build of llama-cpp-python needs.
      - name: Install Vulkan SDK
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.313.2
        run: |
          curl.exe -f -L -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" `
            "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"

      - name: Install make
        run: choco install make -y

      # Resolve the pinned llama-cpp-python version from the Makefile so the
      # cache key tracks it automatically — bumping LLAMA_VERSION invalidates
      # the stale wheel instead of silently reusing it.
      - name: Resolve llama-cpp-python version
        id: llama-ver
        run: echo "version=$(grep '^LLAMA_VERSION' Makefile | sed 's/.*:= *//')" >> "$GITHUB_OUTPUT"

      # The MSVC source build of llama-cpp-python is slow (tens of minutes).
      # It's deterministic for a fixed (llama version, Vulkan backend, py3.11,
      # runner) tuple, so cache the compiled wheel and only recompile when one
      # of those changes.
      - name: Cache llama-cpp-python Vulkan wheel
        id: llama-wheel-cache
        uses: actions/cache@v4
        with:
          path: wheelhouse
          key: llama-cpp-${{ steps.llama-ver.outputs.version }}-vulkan-py311-windows-2022

      - name: Pre-build llama-cpp-python Vulkan wheel
        if: steps.llama-wheel-cache.outputs.cache-hit != 'true'
        env:
          # Keep in sync with LLAMA_CMAKE_ARGS in the Makefile so the cached
          # wheel matches what the make fallback would build.
          CMAKE_ARGS: "-DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DGGML_AVX2=ON"
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ env.NUMBER_OF_PROCESSORS }}
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip wheel "llama-cpp-python==${{ steps.llama-ver.outputs.version }}" \
            --no-binary llama-cpp-python --no-deps \
            --index-url=https://pypi.org/simple \
            -w wheelhouse --no-cache-dir

      # On a cache hit `make build` installs the prebuilt wheel from wheelhouse/
      # via --find-links (Makefile); otherwise the Makefile builds from source
      # with its own LLAMA_CMAKE_ARGS (Vulkan).
      - name: Install dependencies
        run: make build

      # Fail early if the Vulkan backend didn't get compiled in. The Vulkan
      # loader (vulkan-1.dll) is bundled into the dist by smartloop.spec so
      # end users don't need any Vulkan runtime installed.
      - name: Verify Vulkan backend built
        run: |
          set -euo pipefail
          LLAMA_LIB="$(cygpath -u "$(.venv/Scripts/python -c 'import os,importlib.util as u; s=u.find_spec("llama_cpp"); print(os.path.join(os.path.dirname(s.origin),"lib"))')")"
          [ -f "$LLAMA_LIB/ggml-vulkan.dll" ] || { echo "FAIL: ggml-vulkan.dll missing — CPU-only build (GGML_VULKAN=ON not honored?)"; exit 1; }
          echo "OK: ggml-vulkan.dll present in $LLAMA_LIB"

      - name: Build slp binary
        run: make build-binary

      - name: Verify build
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="$(dist/slp/slp --version | awk '{print $NF}')"
          [ "$VER" = "${TAG#v}" ] || { echo "FAIL: binary reports version $VER, tag says ${TAG#v}"; exit 1; }
          GGML_VULKAN="$(find dist/slp/_internal -name ggml-vulkan.dll | head -1)"
          [ -n "$GGML_VULKAN" ] || { echo "FAIL: ggml-vulkan.dll missing — CPU-only build"; exit 1; }
          [ -f "$(dirname "$GGML_VULKAN")/vulkan-1.dll" ] || { echo "FAIL: vulkan-1.dll (Vulkan loader) not bundled next to ggml-vulkan.dll"; exit 1; }
          echo "OK: slp $VER, Vulkan backend present, loader bundled."

      # Authenticode-sign before archiving so the zip and its checksum cover the
      # signed binaries. This is the Windows counterpart of the macOS sign +
      # notarize steps: an unsigned slp.exe has no reputation and is blocked by
      # Smart App Control / WDAC (Application Control). Azure Trusted Signing is
      # a Microsoft-operated CA, so signed binaries are trusted immediately.
      # Auth is OIDC (federated) via the job's `id-token: write` — no secrets.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign binaries (Authenticode)
        uses: azure/trusted-signing-action@v0.5.9
        with:
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          # Sign slp.exe and every bundled DLL so a publisher-based WDAC policy
          # that validates loaded modules is satisfied, not just the launcher.
          files-folder: dist/slp
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist/slp/slp.exe
          Write-Host "slp.exe: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "slp.exe signature is $($sig.Status), expected Valid"
          }

      - name: Archive
        run: make archive-zip

      - name: Compute SHA256
        run: sha256sum windows-amd64-slp.zip | tee windows-amd64-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64-slp
          path: |
            windows-amd64-slp.zip
            windows-amd64-sha256.txt

  publish:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64-slp
          path: artifacts/linux-amd64

      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-slp
          path: artifacts/linux-arm64

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: darwin-arm64-slp
          path: artifacts/darwin-arm64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64-slp
          path: artifacts/windows-amd64

      - name: Prepare release assets
        run: |
          mv artifacts/linux-amd64/*-slp.tar.gz linux-amd64-slp.tar.gz
          mv artifacts/linux-arm64/*-slp.tar.gz linux-arm64-slp.tar.gz
          mv artifacts/darwin-arm64/*-slp.tar.gz darwin-arm64-slp.tar.gz
          mv artifacts/windows-amd64/windows-amd64-slp.zip .
          ls -lh *-slp.*

      - name: Generate checksums
        run: sha256sum *-slp.* > checksums-sha256.txt

      # The aws CLI on the runner talks to R2's S3 API. Single-part PUTs
      # (every archive is under the 5 GB limit) keep each object's ETag its
      # MD5. Retags re-upload the same version, so objects are cached for an
      # hour rather than forever.
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          for s in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ENDPOINT_URL; do
            [ -n "${!s}" ] || { echo "::error::R2 secret for $s is not set"; exit 1; }
          done
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          DEST="s3://$R2_BUCKET/slp/${VERSION}"
          aws configure set default.s3.multipart_threshold 5GB
          for f in linux-amd64-slp.tar.gz linux-arm64-slp.tar.gz darwin-arm64-slp.tar.gz windows-amd64-slp.zip checksums-sha256.txt; do
            aws s3 cp "$f" "$DEST/$f" --cache-control "public, max-age=3600" --no-progress
          done
          echo "Uploaded to $DEST"
          aws s3 ls "$DEST/"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # Idempotent for retags: replace any existing release for this tag.
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
