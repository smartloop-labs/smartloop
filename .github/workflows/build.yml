name: Build & Publish

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  # Releases live in Cloudflare R2 (no egress charge) and are served at
  # dl.smartloop.ai; see slp-infra-project cloudflare/README.md.
  R2_BUCKET: smartloop-releases
  CARGO_TERM_COLOR: always
  # Every archive must carry the embedding model: Studio's installer refuses
  # one without it.  See BUNDLE_EMBEDDINGS in the Makefile.
  REQUIRE_EMBEDDINGS: "1"

jobs:
  # Runs on every PR and branch push as well as on releases. Builds without
  # GPU features (CPU llama.cpp), so no Vulkan SDK is needed; tests that need
  # a model file or the network are #[ignore]d.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || '' }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # cmake builds llama.cpp; libclang drives bindgen for the -sys crates.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: cargo test
        run: cargo test --locked

  build-linux:
    # Release builds only: tag pushes and manual dispatches.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          # LunarG ships no arm64 apt packages, so arm64 builds on 24.04 where
          # the distro's own Vulkan headers/glslc are new enough for ggml.
          # DGX Spark (DGX OS 7) is 24.04-based, so glibc 2.39 is fine there.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # The Vulkan SDK provides the headers, loader, and glslc that the
      # GGML_VULKAN=ON build of llama.cpp (llama-cpp-sys-2, --features vulkan)
      # needs.
      - name: Install Vulkan SDK
        if: matrix.arch == 'amd64'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install Vulkan headers, loader and glslc (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers spirv-tools

      # cmake builds llama.cpp; libclang drives bindgen for the -sys crates.
      # mupdf's system-fonts feature (font-kit) needs fontconfig, which the
      # ubuntu-24.04-arm image doesn't ship.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev pkg-config libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}-vulkan

      - name: Build slp binary
        run: make build-binary

      - name: Verify build
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="$(dist/slp/slp --version | awk '{print $NF}')"
          [ "$VER" = "${TAG#v}" ] || { echo "FAIL: binary reports version $VER, tag says ${TAG#v}"; exit 1; }
          # llama.cpp is linked statically, so the Vulkan backend lives inside
          # the slp binary itself.
          grep -aq ggml_vulkan dist/slp/slp || { echo "FAIL: ggml-vulkan not compiled in — CPU-only build"; exit 1; }
          # The Vulkan loader ships in dist/slp/lib and is found through the
          # binary's $ORIGIN/lib RUNPATH (build.rs); the ICD/driver comes from
          # the host GPU.
          [ -f dist/slp/lib/libvulkan.so.1 ] || { echo "FAIL: libvulkan.so.1 (Vulkan loader) not bundled into the dist"; exit 1; }
          ldd dist/slp/slp | grep 'libvulkan.so.1' | grep -q "$PWD/dist/slp/lib/" || { echo "FAIL: slp does not resolve the bundled libvulkan.so.1:"; ldd dist/slp/slp; exit 1; }
          missing="$(ldd dist/slp/slp | awk '/not found/{print $1}' || true)"
          [ -z "$missing" ] || { echo "FAIL: unresolved deps:"; echo "$missing"; exit 1; }
          # GPU inference is Vulkan; a CUDA link would require the >1GB
          # nvidia-cu12 runtime on every user machine.
          cuda="$(ldd dist/slp/slp | grep -E 'libcud|libcublas|libnvrtc' || true)"
          [ -z "$cuda" ] || { echo "FAIL: CUDA libs linked (expected Vulkan-only):"; echo "$cuda"; exit 1; }
          echo "OK: slp $VER, Vulkan backend present, loader bundled, no CUDA libs."

      - name: Archive
        run: make archive

      - name: Compute SHA256
        run: sha256sum *-slp.tar.gz | tee linux-${{ matrix.arch }}-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-slp
          path: |
            *-slp.tar.gz
            linux-${{ matrix.arch }}-sha256.txt

  build-macos:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64-metal

      # The release build uses Metal, llama.cpp's native backend on Apple
      # Silicon (make build-binary: --features metal). To add Vulkan via
      # MoltenVK, `brew install vulkan-headers vulkan-loader molten-vk shaderc
      # spirv-headers spirv-tools` here and build with
      # CARGO_FEATURES="metal vulkan"; the Makefile then bundles MoltenVK.

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build slp binary
        run: make build-binary

      - name: Verify build
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="$(dist/slp/slp --version | awk '{print $NF}')"
          [ "$VER" = "${TAG#v}" ] || { echo "FAIL: binary reports version $VER, tag says ${TAG#v}"; exit 1; }
          # llama.cpp is linked statically, so the Metal backend lives inside
          # the slp binary itself.
          grep -aq ggml_metal dist/slp/slp || { echo "FAIL: Metal backend not compiled in"; exit 1; }
          # Users have no Homebrew prefix: the binary may only link system
          # libraries or ones bundled under @executable_path.
          bad="$(otool -L dist/slp/slp | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/|@executable_path/)' || true)"
          [ -z "$bad" ] || { echo "FAIL: slp links non-system libraries:"; echo "$bad"; exit 1; }
          echo "OK: slp $VER, Metal backend present, only system libraries linked."

      # App Store review rejects binaries referencing the deprecated Accelerate
      # LAPACK symbols _dcabs1_/_lsame_/_xerbla_array__. Studio's Mac App Store
      # build bundles this framework verbatim, so catch it here rather than in
      # an ITMS rejection mail days later.
      - name: Verify no deprecated Apple APIs
        run: make check-apple-symbols

      - name: Sign
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: make sign

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: make notarize

      - name: Archive
        run: make archive

      - name: Compute SHA256
        run: shasum -a 256 *-slp.tar.gz | tee darwin-arm64-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-slp
          path: |
            *-slp.tar.gz
            darwin-arm64-sha256.txt

  build-windows:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    # Scopes the Azure OIDC token to a stable subject
    # (repo:smartloop-ai/smartloop:environment:release) so a single Trusted
    # Signing federated credential covers both tag-push and manual dispatch runs.
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # The Vulkan SDK provides the headers, loader (vulkan-1.lib/.dll), and
      # glslc that the GGML_VULKAN=ON build of llama.cpp needs; llama-cpp-sys-2
      # locates it through VULKAN_SDK.
      - name: Install Vulkan SDK
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.313.2
        run: |
          curl.exe -f -L -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" `
            "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"

      - name: Install make
        run: choco install make -y

      # llama.cpp's MSVC build is slow (tens of minutes); rust-cache keeps the
      # compiled -sys crates between runs and re-keys when Cargo.lock changes.
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-amd64-vulkan

      - name: Build slp binary
        run: make build-binary

      - name: Verify build
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="$(dist/slp/slp --version | awk '{print $NF}')"
          [ "$VER" = "${TAG#v}" ] || { echo "FAIL: binary reports version $VER, tag says ${TAG#v}"; exit 1; }
          # llama.cpp is linked statically, so the Vulkan backend lives inside
          # slp.exe itself.
          grep -aq ggml_vulkan dist/slp/slp.exe || { echo "FAIL: ggml-vulkan not compiled in — CPU-only build"; exit 1; }
          [ -f dist/slp/vulkan-1.dll ] || { echo "FAIL: vulkan-1.dll (Vulkan loader) not bundled next to slp.exe"; exit 1; }
          echo "OK: slp $VER, Vulkan backend present, loader bundled."

      # Authenticode-sign before archiving so the zip and its checksum cover the
      # signed binaries. This is the Windows counterpart of the macOS sign +
      # notarize steps: an unsigned slp.exe has no reputation and is blocked by
      # Smart App Control / WDAC (Application Control). Azure Trusted Signing is
      # a Microsoft-operated CA, so signed binaries are trusted immediately.
      # Auth is OIDC (federated) via the job's `id-token: write` — no secrets.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign binaries (Authenticode)
        uses: azure/trusted-signing-action@v0.5.9
        with:
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          # Sign slp.exe and every bundled DLL (Vulkan loader, MSVC runtime) so
          # a publisher-based WDAC policy that validates loaded modules is
          # satisfied, not just the executable.
          files-folder: dist/slp
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist/slp/slp.exe
          Write-Host "slp.exe: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "slp.exe signature is $($sig.Status), expected Valid"
          }

      - name: Archive
        run: make archive-zip

      - name: Compute SHA256
        run: sha256sum windows-amd64-slp.zip | tee windows-amd64-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64-slp
          path: |
            windows-amd64-slp.zip
            windows-amd64-sha256.txt

  publish:
    needs: [test, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || '' }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64-slp
          path: artifacts/linux-amd64

      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-slp
          path: artifacts/linux-arm64

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: darwin-arm64-slp
          path: artifacts/darwin-arm64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64-slp
          path: artifacts/windows-amd64

      - name: Prepare release assets
        run: |
          mv artifacts/linux-amd64/*-slp.tar.gz linux-amd64-slp.tar.gz
          mv artifacts/linux-arm64/*-slp.tar.gz linux-arm64-slp.tar.gz
          mv artifacts/darwin-arm64/*-slp.tar.gz darwin-arm64-slp.tar.gz
          mv artifacts/windows-amd64/windows-amd64-slp.zip .
          ls -lh *-slp.*

      - name: Generate checksums
        run: sha256sum *-slp.* > checksums-sha256.txt

      # The aws CLI on the runner talks to R2's S3 API. Single-part PUTs
      # (every archive is under the 5 GB limit) keep each object's ETag its
      # MD5. Retags re-upload the same version, so objects are cached for an
      # hour rather than forever.
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          for s in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ENDPOINT_URL; do
            [ -n "${!s}" ] || { echo "::error::R2 secret for $s is not set"; exit 1; }
          done
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          DEST="s3://$R2_BUCKET/slp/${VERSION}"
          aws configure set default.s3.multipart_threshold 5GB
          for f in linux-amd64-slp.tar.gz linux-arm64-slp.tar.gz darwin-arm64-slp.tar.gz windows-amd64-slp.zip checksums-sha256.txt; do
            aws s3 cp "$f" "$DEST/$f" --cache-control "public, max-age=3600" --no-progress
          done
          echo "Uploaded to $DEST"
          aws s3 ls "$DEST/"

      # The library is published to a static sparse Cargo registry under
      # crates/ in the same bucket (dl.smartloop.ai/crates/), never to
      # crates.io: config.json, the index file and the .crate archives.
      # --no-verify because the test job already built this commit.
      - name: Publish the crate to the registry on R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CARGO_REGISTRIES_SMARTLOOP_INDEX: sparse+https://dl.smartloop.ai/crates/
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          REGISTRY="s3://$R2_BUCKET/crates"
          cargo package --no-verify --locked
          CRATE="target/package/smartloop-${VERSION}.crate"
          [ -f "$CRATE" ] || { echo "::error::$CRATE not built; does Cargo.toml's version match $TAG?"; exit 1; }

          # Start from the published index so earlier versions stay listed.
          INDEX="sm/ar/smartloop"
          mkdir -p "registry/$(dirname "$INDEX")"
          if aws s3 ls "$REGISTRY/$INDEX"; then
            aws s3 cp "$REGISTRY/$INDEX" "registry/$INDEX" --no-progress
          fi
          [ "$(python3 packaging/crate_index.py "$CRATE" registry)" = "$INDEX" ]
          echo '{"dl": "https://dl.smartloop.ai/crates/dl/{crate}/{version}/{crate}-{version}.crate"}' > registry/config.json

          # The archive before the index line that points at it.
          aws s3 cp "$CRATE" "$REGISTRY/dl/smartloop/${VERSION}/smartloop-${VERSION}.crate" \
            --cache-control "public, max-age=3600" --no-progress
          for f in "$INDEX" config.json; do
            aws s3 cp "registry/$f" "$REGISTRY/$f" --cache-control "no-cache" --no-progress
          done
          echo "Published smartloop $VERSION to https://dl.smartloop.ai/crates/"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # Idempotent for retags: replace any existing release for this tag.
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
