name: Build llama-cpp-python wheel

# One-off (manual) build of the portable CUDA llama-cpp-python wheel for Windows,
# published to gs://smartloop-gcp-us-east-releases/wheels (served at
# https://dl.smartloop.ai/wheels). abetlen has no CUDA wheel for our pinned
# version on Windows, so we compile one with GGML_NATIVE=OFF (AVX2 baseline) so
# it runs on any x86-64-v3 CPU. Run this once per llama version bump; the regular
# release build then just downloads the wheel instead of recompiling llama.cpp.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-llama-wheel:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.0'

      - name: Install make
        run: choco install make -y

      - name: Build portable CUDA llama wheel
        run: make llama-wheel

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload wheel to GCS
        run: make release-llama-wheel
