name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute next version
        id: next
        run: |
          # The crate version (the [package] table of Cargo.toml) is the source of truth.
          CURRENT=$(awk -F'"' '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{print $2; exit}' Cargo.toml)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $VERSION (${{ inputs.bump }})"

      - name: Update version files
        run: |
          VERSION="${{ steps.next.outputs.version }}"
          # Cargo.toml: only the first `version =` line, i.e. the [package] one.
          sed -i "0,/^version = .*/s//version = \"${VERSION}\"/" Cargo.toml
          # Cargo.lock: the smartloop package entry (version follows its name).
          sed -i "/^name = \"smartloop\"$/{n;s/^version = \".*\"/version = \"${VERSION}\"/}" Cargo.lock
          sed -i "s/^VERSION=\".*\"/VERSION=\"${VERSION}\"/" install.sh
          sed -i "s/^\(\$Version *= *\)'.*'/\1'${VERSION}'/" install.ps1
          echo "Updated to v${VERSION}"
          awk -F'"' '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{print "Cargo.toml: " $2; exit}' Cargo.toml
          grep -A1 '^name = "smartloop"$' Cargo.lock
          grep '^VERSION=' install.sh
          grep '^\$Version' install.ps1
          # Fail the bump rather than open a PR with a half-updated version.
          grep -q "^version = \"${VERSION}\"" Cargo.toml
          grep -A1 '^name = "smartloop"$' Cargo.lock | grep -q "^version = \"${VERSION}\"$"
          grep -q "^VERSION=\"${VERSION}\"" install.sh
          grep -q "^\$Version *= *'${VERSION}'" install.ps1

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.next.outputs.version }}"
          BRANCH="release/v${VERSION}"
          git checkout -b "$BRANCH"
          git add Cargo.toml Cargo.lock install.sh install.ps1
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump version to ${VERSION}"
          git push origin "$BRANCH"
          gh pr create \
            --title "Release v${VERSION}" \
            --body "Bumps version to \`${VERSION}\` (\`${{ inputs.bump }}\` bump from \`${{ steps.next.outputs.current }}\`)." \
            --base main \
            --head "$BRANCH"

  tag-and-build:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(awk -F'"' '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{print $2; exit}' Cargo.toml)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Trigger build
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml -f tag="${{ steps.version.outputs.tag }}"
