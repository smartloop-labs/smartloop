[package]
name = "smartloop"
version = "1.2.33"
edition = "2024"
rust-version = "1.85"
description = "AI Agent harness for extracting information and creating new content"
license-file = "LICENSE"
repository = "https://github.com/smartloop-ai/smartloop"
# Published only to the sparse registry at dl.smartloop.ai/crates/ (the
# publish job in build.yml), never to crates.io.
publish = ["smartloop"]
build = "build.rs"
include = ["/src/**/*", "/build.rs", "/proto/**/*", "/README.md", "/LICENSE"]

[lib]
name = "smartloop"
path = "src/lib.rs"

[[bin]]
name = "slp"
path = "src/main.rs"

[features]
default = []
# GPU backends for llama.cpp, passed straight through to llama-cpp-2.
metal = ["llama-cpp-2/metal"]
vulkan = ["llama-cpp-2/vulkan"]
cuda = ["llama-cpp-2/cuda"]
# GPU backends for llama.cpp, passed straight through to llama-cpp-2.

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart", "macros", "ws"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "indexmap", "preserve_order", "preserve_path_order"] }
base64 = "0.23.1"
bytes = "1.12.1"
calamine = "0.35.0"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
comfy-table = "8.0.0"
console = "0.16.6"
dirs = "7.0.0"
fancy-regex = "0.19.2"
# rustcrypto instead of the default openssl backend: no OpenSSL to link
# (Homebrew dylibs on macOS, an SDK on Windows).
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
futures = "0.3.34"
glob = "0.3.4"
hex = "0.4.3"
htmd = "0.5.5"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = "1.11.1"
hyper-util = { version = "0.1", features = ["tokio"] }
image = "0.25.9"
indexmap = { version = "2.14.2", features = ["serde"] }
indicatif = "0.18.6"
libc = "0.2.190"
llama-cpp-2 = { version = "0.1.158", features = ["mtmd"] }
markup5ever_rcdom = "0.38.0"
md-5 = "0.11.0"
mime_guess = "2.0.5"
minijinja = { version = "2.24", features = ["loop_controls", "json", "preserve_order"] }
minijinja-contrib = { version = "2.24", features = ["pycompat"] }
mupdf = "0.8.0"
ndarray = "0.17.2"
once_cell = "1.21.4"
owo-colors = "4.4.0"
parking_lot = "0.12.5"
prost = "0.14.4"
prost-types = "0.14.4"
quick-xml = "0.41.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "multipart", "gzip", "blocking", "rustls"] }
rmcp = { version = "2.2.0", features = ["client", "server", "transport-child-process", "transport-streamable-http-client-reqwest", "auth", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled", "serde_json"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
shlex = "2.0.1"
sysinfo = "0.36.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
toml = "1.1.6"
tonic = "0.14.5"
tonic-prost = "0.14.5"
tower = { version = "0.5.3", features = ["util", "timeout"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs", "limit"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
walkdir = "2.5.0"
zip = "7.2.0"

[dev-dependencies]
ctor = "1.0.13"
mockall = "0.15.0"
pretty_assertions = "1.4.1"
serial_test = "3.5.0"
wiremock = "0.6.5"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14.5"

[profile.dev]
# Keep debug builds small; the shared target dir otherwise grows by GBs.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `make run-debug`: release optimisation, but without the link-time and
# single-unit codegen that make every release rebuild take minutes.  Shipped
# binaries still come from `release` (`make build-binary`).
[profile.dev-run]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
